<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        
        <header class="text-center mb-5">
            <h1 class="main-title">نظام إدارة النتائج</h1>
            <p class="subtitle">
                إدارة درجات الطلاب وتفعيل لجنة الرأفة
            </p>
        </header>

        
        <div class="card form-card shadow-sm mb-4">

            <div class="card-body p-4">

                <h3 class="section-title mb-4">إضافة طالب جديد</h3>

                <form id="studentForm">

                    <div class="mb-3">
                        <label for="studentName" class="form-label">
                            اسم الطالب
                        </label>

                        <input type="text"
                               id="studentName"
                               class="form-control"
                               placeholder="أدخل اسم الطالب">
                    </div>

                    <div class="row">

                        <div class="col-md-4 mb-3">
                            <label for="grade1" class="form-label">
                                المادة الأولى
                            </label>

                            <input type="number"
                                   id="grade1"
                                   class="form-control"
                                   placeholder="الدرجة">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="grade2" class="form-label">
                                المادة الثانية
                            </label>

                            <input type="number"
                                   id="grade2"
                                   class="form-control"
                                   placeholder="الدرجة">
                        </div>

                        <div class="col-md-4 mb-3">
                            <label for="grade3" class="form-label">
                                المادة الثالثة
                            </label>

                            <input type="number"
                                   id="grade3"
                                   class="form-control"
                                   placeholder="الدرجة">
                        </div>

                    </div>

                    <div class="mb-4">
                        <label for="attendance" class="form-label">
                            نسبة الحضور
                        </label>

                        <input type="number"
                               id="attendance"
                               class="form-control"
                               placeholder="أدخل نسبة الحضور">
                    </div>

                    
                    <div id="errorBox" class="alert alert-danger d-none">
                    </div>

                    
                    <div class="d-flex flex-wrap gap-2">

                        <button type="button"
                                id="addStudentBtn"
                                class="btn btn-primary">
                            إضافة طالب
                        </button>

                        <button type="button"
                                id="graceBtn"
                                class="btn btn-success">
                            تفعيل لجنة الرأفة
                        </button>

                    </div>

                </form>

            </div>
        </div>

        
        <div class="card shadow-sm mb-4">

            <div class="card-body p-4">

                <h3 class="section-title mb-4">قائمة الطلاب</h3>

                <div id="studentsContainer">
                    <p class="empty-message">
                        لم يتم إضافة أي طالب حتى الآن.
                    </p>
                </div>

            </div>
        </div>


        <div class="card report-card shadow-sm">

            <div class="card-body p-4">

                <h3 class="section-title mb-4">
                    تقرير لجنة الرأفة
                </h3>

                <div id="reportContainer">
                    <p class="empty-message">
                        سيظهر التقرير هنا.
                    </p>
                </div>

            </div>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
